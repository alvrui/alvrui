config_plantillas_evento:
  - id: "trafalgar_1805"
    familia: "sesion_institucional"
    tipo: "historico_fijo"
    fecha: "1805-10-21"
    texto_base: "La flota franco-espanola ha sido derrotada por los Britanicos en Trafalgar. Cadiz se convierte en el ultimo bastion de la resistencia."
    precondiciones: []
    ponderacion: 100
    opciones: []
  - id: "carta_proveedor_indias"
    familia: "lectura_expediente"
    tipo: "dinamico_protagonista"
    fecha_inicio: "1805-10-22"
    fecha_fin: "1805-10-31"
    texto_base: "Un mensajero te entrega una carta de tu proveedor en Peru. Te recuerda que le debes 500 reales por un envio de mercancias."
    precondiciones:
      - tipo: "protagonista"
        objetivo: "oficio"
        operador: "=="
        valor: "comerciante"
    ponderacion: 80
    opciones:
      - id: "pagar_deuda"
        texto: "Pagar los 500 reales."
        efectos:
          - tipo: "medidor"
            objetivo: "recursos"
            delta: -10
          - tipo: "compromiso"
            objetivo: "deuda_proveedor_indias"
            accion: "cumplir"
      - id: "ignorar_carta"
        texto: "Ignorar la carta por ahora."
        efectos:
          - tipo: "medidor"
            objetivo: "reputacion"
            delta: -5
          - tipo: "compromiso"
            objetivo: "deuda_proveedor_indias"
            accion: "incumplir"

config_cooldowns:
  - id: "decision_politica"
    tipo: "medidor"
    duracion_base: 3
    aplicable_a: ["influencia", "reputacion", "coherencia"]
  - id: "traicion_faccion"
    tipo: "faccion"
    duracion_base: 5
    aplicable_a: ["liberales_progresistas", "consulado", "serviles"]

